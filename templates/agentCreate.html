{% extends "layout.html" %}

{% block body %}

<div class="navbar">
    <ul>
        <li><a href="/home"><i class="material-icons">arrow_back</i></a></li>
    </ul>
</div>

<div class="login-box">
    <form method="POST" action="/agentCreate">
        <input type="text" id="agentName" name="agentName" placeholder="Agent Name" required>
        <input type="text" id="webpageLink" name="webpageLink" placeholder="Webpage Link" required>
        <input type="text" id="elementXpath" name="elementXpath" placeholder="Element XPath" required>
        <input type="submit" value="Create Agent">
    </form>
</div>

{% endblock %}
