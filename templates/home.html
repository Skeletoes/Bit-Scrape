{% extends "layout.html" %}

{% block body %}

<div class="navbar">
    <ul>
        <li><a href="/"><i class="material-icons">arrow_back</i></a></li>
    </ul>
</div>

<div class="agentCreate">
    <a href="/agentCreate"><button type="button" class="createAgent-btn"><i class="material-icons">add</i></button></a>
</div>

<div class="configure">
    <a href="/configure"><button type="button" class="configure-btn"><i class="material-icons">perm_identity</i></button></a>
</div>

<form action="/default" method="POST">
    <div class="agent-list">
        {% for agent in agents %}
            <div class="agent-box">
                <p>{{ agent }}</p>
                <button type="submit" class="agent-btn" name="agentName" formaction="/agentSelect" value="{{ agent }}"><i class="material-icons">settings</i></button>
            </div>
        {% endfor %}
    </div>
</form>


{% endblock %}
