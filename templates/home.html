{% extends "layout.html" %}

{% block body %}

<div class="navbar">
    <ul>
        <li><a href="/">Logout</a></li>
    </ul>
</div>

<div class="agentCreate">
    <a href="/agentCreate"><button type="button" class="createAgent-btn">Create Agent</button></a>
</div>

<div class="configure">
    <a href="/configure"><button type="button" class="configure-btn">Configure</button></a>
</div>
<form action="/default" method="POST">
    <div class="agent-list">
        {% for agent in agents %}
            <div class="agent-box">
                <h1>{{ agent }}</h1>
                <button type="submit" formaction="/view" name="" value="{{ agent }}">Delete</button>
                <button type="submit" formaction="/view" name="" value="{{ agent }}">Configure</button>
            </div>
        {% endfor %}
    </div>
</form>


{% endblock %}
