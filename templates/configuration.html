{% extends "layout.html" %}

{% block body %}

<div class="navbar">
    <ul>
        <li><a href="/home"><i class="material-icons">arrow_back</i></a></li>
    </ul>
</div>

<div class="login-box">
    <form method="POST" action="/configure">
        <input type="text" id="newUsername" name="newUsername" placeholder="New Username" value="">
        <input type="password" id="newPassword" name="newPassword" placeholder="New Password">
        <input type="text" id="newEmail" name="newEmail" placeholder="New Email">
        <input type="submit" value="Save">
        <div class="create-row">
            <a href="/accountDelete"><button type="button" class="create-btn">Delete Account</button></a>
        </div>
    </form>
</div>

{% endblock %}
