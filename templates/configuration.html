{% extends "layout.html" %}

{% block body %}

<div class="loginNavbar"></div>

<div class="login-box">
    <form method="POST" action="/configure">
        <input type="text" id="newUsername" name="newUsername" placeholder="New Username" required>
        <input type="password" id="newPassword" name="newPassword" placeholder="New Password" required>
        <input type="number" id="scrapeInterval" name="scrapeInterval" min="1" max="24" step="1" placeholder="Scrape Interval" required>
        <input type="submit" value="Save">
        <div class="create-row">
            <a href="/accountDelete"><button type="button" class="create-btn">Delete Account</button></a>
        </div>
    </form>
</div>

{% endblock %}
