{% extends "layout.html" %}


{% block head %}

<style>
  html, body { position: relative; width: 400px; height: 580px; margin: 0; padding: 0; overflow: hidden; }
  footer { position: absolute; bottom: 25px; width: 100%; }
</style>

{% endblock %}


{% block body %}

<div class="loginNavbar"></div>
<div class="loader"></div>

<script>
  function checkStatus() {
    fetch("{{ url_for('loadCheck') }}", { redirect: 'manual' })
      .then(res => {
        // 'opaqueredirect' means loadCheck issued a redirect() — meaning the task is done
        if (res.type === 'opaqueredirect' || res.status === 302) {
          window.location.href = "{{ url_for('loadCheck') }}";
        } else {
          setTimeout(checkStatus, 2000);
        }
      });
  }
  checkStatus();
</script>

{% endblock %}
